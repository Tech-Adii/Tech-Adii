  <path d="M20 20 H44 L56 32" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
  <circle cx="58" cy="34" r="2.5" fill="#38bdf8" fill-opacity="0.55"/>
  <path d="M1180 20 H1156 L1144 32" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.2"/>
