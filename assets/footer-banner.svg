      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fClip"><rect x="1" y="1" width="1198" height="112" rx="14"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', Arial, sans-serif; }
    @keyframes fSweep { 0% { transform: translateX(1200px); } 100% { transform: translateX(-280px); } }
    .f-scan { animation: fSweep 4.5s ease-in-out infinite; }
  </style>

  <rect x="1" y="1" width="1198" height="112" rx="14" fill="url(#fBg)" stroke="url(#fBorder)" stroke-width="1.5"/>
  <g clip-path="url(#fClip)">
