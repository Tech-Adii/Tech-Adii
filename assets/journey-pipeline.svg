<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="224" viewBox="0 0 1200 224" fill="none">
  <defs>
    <linearGradient id="jBg" x1="0" y1="0" x2="1200" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="45" y1="122" x2="1155" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="jGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', Arial, sans-serif; }
    @keyframes packetMove {
      0% { transform: translateX(0px); opacity: 0; }
      8% { opacity: 1; }
      92% { opacity: 1; }
      100% { transform: translateX(870px); opacity: 0; }
    }
    .packet { animation: packetMove 4.5s linear infinite; }
  </style>

  <!-- Frame -->
  <rect x="1" y="1" width="1198" height="222" rx="14" fill="url(#jBg)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="45" y="32" fill="#64748b" font-size="11.5" font-weight="700" letter-spacing="1.6" class="mono">ENGINEERING EVOLUTION // SILICON TO APPLIED INTELLIGENCE</text>
  <text x="1155" y="32" text-anchor="end" fill="#475569" font-size="11.5" font-weight="600" class="mono">2023 ──► PRESENT</text>

  <!-- Bus Connector Line -->
  <line x1="165" y1="122" x2="1035" y2="122" stroke="url(#busGrad)" stroke-opacity="0.38" stroke-width="3"/>
  <circle cx="165" cy="122" r="5" fill="#e2e8f0" filter="url(#jGlow)" class="packet"/>

  <!-- Card 1: ECE -->
  <rect x="45" y="54" width="240" height="138" rx="10" fill="#111827" stroke="#38bdf8" stroke-opacity="0.48" stroke-width="1.4"/>
  <rect x="61" y="68" width="96" height="20" rx="10" fill="#38bdf8" fill-opacity="0.14"/>
  <text x="109" y="82" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="700" class="mono">2023 – 2026</text>
  <text x="61" y="113" fill="#f8fafc" font-size="17" font-weight="700" class="sans">Diploma in ECE</text>
  <text x="61" y="137" fill="#94a3b8" font-size="11.5" class="sans">M.E.S. R.N. Shetty Polytechnic</text>
  <text x="61" y="154" fill="#64748b" font-size="11.5" class="sans">Sirsi · Student of the Year</text>
  <text x="61" y="177" fill="#38bdf8" font-size="12" font-weight="700" class="mono">9.92 CGPA · Gold Medalist</text>

  <!-- Card 2: DCET -->
  <rect x="335" y="54" width="240" height="138" rx="10" fill="#111827" stroke="#10b981" stroke-opacity="0.48" stroke-width="1.4"/>
  <rect x="351" y="68" width="88" height="20" rx="10" fill="#10b981" fill-opacity="0.14"/>
  <text x="395" y="82" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="700" class="mono">DCET 2026</text>
  <text x="351" y="113" fill="#f8fafc" font-size="17" font-weight="700" class="sans">Karnataka DCET</text>
  <text x="351" y="137" fill="#94a3b8" font-size="11.5" class="sans">Statewide Lateral Entrance</text>
  <text x="351" y="154" fill="#64748b" font-size="11.5" class="sans">Karnataka Examination Auth.</text>
  <text x="351" y="177" fill="#34d399" font-size="12" font-weight="700" class="mono">State Rank 38 · Top %ile</text>

  <!-- Card 3: RVCE -->
  <rect x="625" y="54" width="240" height="138" rx="10" fill="#111827" stroke="#8b5cf6" stroke-opacity="0.48" stroke-width="1.4"/>
  <rect x="641" y="68" width="96" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.16"/>
  <text x="689" y="82" text-anchor="middle" fill="#c4b5fd" font-size="10.5" font-weight="700" class="mono">2026 – 2029</text>
  <text x="641" y="113" fill="#f8fafc" font-size="17" font-weight="700" class="sans">B.E. CSE (AI &amp; ML)</text>
  <text x="641" y="137" fill="#94a3b8" font-size="11.5" class="sans">RV College of Engineering</text>
  <text x="641" y="154" fill="#64748b" font-size="11.5" class="sans">Bengaluru · Lateral Entry</text>
  <text x="641" y="177" fill="#c4b5fd" font-size="12" font-weight="700" class="mono">AI · ML · Security · Systems</text>

  <!-- Card 4: Shipping -->
  <rect x="915" y="54" width="240" height="138" rx="10" fill="#111827" stroke="#f59e0b" stroke-opacity="0.48" stroke-width="1.4"/>
  <rect x="931" y="68" width="106" height="20" rx="10" fill="#f59e0b" fill-opacity="0.14"/>
  <text x="984" y="82" text-anchor="middle" fill="#fbbf24" font-size="10.5" font-weight="700" class="mono">SHIPPING NOW</text>
  <text x="931" y="113" fill="#f8fafc" font-size="17" font-weight="700" class="sans">Builder &amp; Mentor</text>
  <text x="931" y="137" fill="#94a3b8" font-size="11.5" class="sans">Desktop AI · Hackathons · IoT</text>
  <text x="931" y="154" fill="#64748b" font-size="11.5" class="sans">Open-Access Student Portals</text>
  <text x="931" y="177" fill="#fbbf24" font-size="12" font-weight="700" class="mono">12K+ Tech Community</text>

  <!-- Junction Nodes -->
  <circle cx="285" cy="122" r="4" fill="#38bdf8"/>
  <circle cx="335" cy="122" r="4" fill="#10b981"/>
  <circle cx="575" cy="122" r="4" fill="#10b981"/>
  <circle cx="625" cy="122" r="4" fill="#8b5cf6"/>
  <circle cx="865" cy="122" r="4" fill="#8b5cf6"/>
  <circle cx="915" cy="122" r="4" fill="#f59e0b"/>
</svg>